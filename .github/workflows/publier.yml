# Publication d'une version : à chaque tag « vX.Y.Z », construit
#   - Daftar-ubuntu-X.Y.Z.zip  (version ordinateur, carnet vide : bash installer.sh)
#   - Daftar-X.Y.Z.apk         (Android, version autonome, signée)
# et les attache à la page « Releases ». Lancement manuel possible (APK de test, sans publication).
name: Publier une version (APK et Ubuntu)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aucune donnée personnelle dans le dépôt
        env:
          DAFTAR_MOTS_INTERDITS: ${{ secrets.DAFTAR_MOTS_INTERDITS }}
        run: bash outils/verifier-depot.sh
      - name: Tests (synchronisation, parité serveur.py ↔ moteur.js)
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Numéro de version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.$GITHUB_RUN_NUMBER"; fi
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # numéro interne Android toujours croissant
          echo "CODE=$(( 100000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "NOMVER=$(sed -n "s/.*nom: '\([^']*\)'.*/\1/p" app/version.js)" >> "$GITHUB_ENV"
          # le tag doit être le numéro de app/version.js (seul endroit de la version)
          NUM="$(sed -n "s/.*numero: '\([^']*\)'.*/\1/p" app/version.js)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$NUM" != "$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ≠ version $NUM de app/version.js : changer le numéro avant de poser le tag."; exit 1
          fi
      - name: Version ordinateur (zip Ubuntu)
        run: |
          mkdir -p dist/Daftar/donnees
          cp -r app serveur.py appya installer.sh desinstaller.sh LISEZMOI.txt dist/Daftar/
          (cd dist && zip -qr "Daftar-ubuntu-$VERSION.zip" Daftar && rm -rf Daftar)
      - name: Version autonome et projet Android
        run: |
          bash outils/construire-web.sh www
          npm ci
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1f4e79' --iconBackgroundColorDark '#1f4e79' --splashBackgroundColor '#1f4e79' --splashBackgroundColorDark '#1f4e79'
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Construction de l'APK
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Signature de l'APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE absent : APK non signé (test seulement, non installable)."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Daftar-$VERSION-non-signe.apk"; exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/appya.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/appya.jks" --ks-key-alias appya \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "dist/Daftar-$VERSION.apk" "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" verify --print-certs "dist/Daftar-$VERSION.apk" | head -n 3
          rm -f "$RUNNER_TEMP/appya.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: Daftar-${{ env.VERSION }}
          path: dist/
      - name: Page « Releases »
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/Daftar-"$VERSION".apk >/dev/null || { echo "::error::APK signé absent : secrets ANDROID_KEYSTORE* à définir."; exit 1; }
          cat > notes.md <<NOTES
          **Daftar $NOMVER $VERSION** : suivi financier, véhicule et maison. Aucune donnée n'est incluse : chaque personne commence avec un carnet vide.

          - **Android** : \`Daftar-$VERSION.apk\` (autoriser l'installation depuis cette source la première fois). Les données restent dans le téléphone : pensez à *Données et réglages › Sauvegarde*.
          - **Ordinateur Ubuntu** : \`Daftar-ubuntu-$VERSION.zip\`, décompresser puis \`bash installer.sh\`.
          - **Lien web** (sans installation) : https://yayayou47.github.io/Daftar/
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "Daftar $NOMVER $VERSION" --notes-file notes.md
      - name: Ménage des anciennes versions (garder la première, l'active et les 2 précédentes)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash outils/elaguer-versions.sh
