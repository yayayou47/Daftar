# Lien web (version autonome) : https://yayayou47.github.io/Daftar/
# Republié automatiquement à chaque envoi sur la branche main.
name: Lien web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Aucune donnée personnelle dans le dépôt
        env:
          DAFTAR_MOTS_INTERDITS: ${{ secrets.DAFTAR_MOTS_INTERDITS }}
        run: bash outils/verifier-depot.sh
      - name: Tests (synchronisation, parité serveur.py ↔ moteur.js)
        run: python3 -m unittest discover -s tests -v
      - name: Version autonome
        run: bash outils/construire-web.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # le déploiement échoue parfois juste après l'envoi de l'archive (« No artifacts named github-pages », incident
      # passager de GitHub, 3 fois le 2026-11-25) : un second essai 30 s plus tard
      - id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attente avant un second essai
        if: steps.deploiement.outcome == 'failure'
        run: sleep 30
      - id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v4
